default_level: item
percentage_metrics:
  - "% báo sai"
charts:
  period_statistics:
    type: bar_line_secondary_y
    bar_mode: overlay
    metrics:
      - "Tổng số"
      - "Báo sai/Lỗi"
    modes:
      SUM: bar
      AVG/ngày: line
    nested_bars:
      background: "Tổng số"
      foreground: "Báo sai/Lỗi"
      aligned_width: true
    group_by:
      - day
      - week
      - month
      - quarter
    average_formula: period_sum / eligible_observed_days
    separate_by:
      - entity_id
      - effective_unit
  metric_combo:
    type: bar_line_secondary_y
    bar_mode: overlay
    dashboard_grid_columns: 2
    bars:
      - "Tổng số"
      - "Báo sai/Lỗi"
    aligned_bar_width: true
    line: "% báo sai"
    separate_by:
      - entity_id
      - effective_unit
  multi_entity_comparison:
    type: selected_metric
    metrics:
      - "Tổng số"
      - "Báo sai/Lỗi"
      - "% báo sai"
    count_chart: grouped_bar
    percentage_chart: line
    max_entities: 3
    require_same:
      - project_id
      - effective_unit
  trend:
    type: line
    x: date
    y: chart_value
    color: entity_label
  comparison:
    type: bar
    x: entity_label
    y: chart_value
