default_level: item
percentage_metrics:
  - "% báo sai"
charts:
  metric_average:
    type: grouped_bar
    metrics:
      - "Tổng số"
      - "Báo sai/Lỗi"
    denominator: available_data_dates_per_metric
    separate_by:
      - effective_unit
  metric_combo:
    type: bar_line_secondary_y
    bar_mode: overlay
    dashboard_grid_columns: 2
    bars:
      - "Tổng số"
      - "Báo sai/Lỗi"
    line: "% báo sai"
    separate_by:
      - entity_id
      - effective_unit
  multi_entity_comparison:
    type: selected_metric
    metrics:
      - "Tổng số"
      - "Báo sai/Lỗi"
      - "% báo sai"
    count_chart: grouped_bar
    percentage_chart: line
    max_entities: 3
    require_same:
      - project_id
      - effective_unit
  trend:
    type: line
    x: date
    y: chart_value
    color: entity_label
  comparison:
    type: bar
    x: entity_label
    y: chart_value
