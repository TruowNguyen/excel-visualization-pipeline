[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-visualization-pipeline"
version = "0.1.0"
description = "Traceable Excel extraction and visualization demo"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=3.0,<4",
  "plotly>=6,<8",
  "streamlit>=1.63,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"excel_visualization_pipeline.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
